spring.application.name=onlinecodeplate
spring.datasource.url=jdbc:mysql://localhost:3306/codingpractice
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080

# Timezone & Serialization Configuration (Asia/Kolkata / IST)
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# File Storage Configuration
file.upload-dir=uploads

# Mail Configuration (Configure via Environment variables / properties)
